<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0b;color:#efece6;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
.page{min-height:100%;height:100svh;max-width:720px;margin:0 auto;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.28em;color:rgba(239,236,230,.5)}
.top b{color:#efece6;font-weight:600}
h1{margin-top:14px;font-size:clamp(30px,9vw,46px);font-weight:700;line-height:1.05;letter-spacing:-.02em}
.sub{margin-top:8px;font-size:13px;line-height:1.55;color:rgba(239,236,230,.62)}
.grid{flex:1;min-height:0;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
.w{position:relative;overflow:hidden;border-radius:14px;background:#141416;display:flex;flex-direction:column;justify-content:space-between;padding:12px;min-height:150px}
.w canvas{position:absolute;inset:0;width:100%;height:100%;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.w:active canvas{transform:scale(1.05)}
.w::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,0) 40%,rgba(10,10,11,.7) 100%);pointer-events:none}
.w>*{position:relative;z-index:2}
.no{font-size:11px;letter-spacing:.14em;color:rgba(255,255,255,.75);display:flex;justify-content:space-between}
.t{font-size:clamp(17px,4.8vw,22px);font-weight:700;line-height:1.2}
.m{margin-top:5px;font-size:11.5px;color:rgba(255,255,255,.75);line-height:1.4}
footer{margin-top:10px;font-size:10.5px;color:rgba(239,236,230,.38);text-align:center;line-height:1.5}
@media (max-height:600px){.sub{display:none}h1{margin-top:8px}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><b>AMBER</b><span>4 个测试</span></div>
  <h1>Amber 的测试</h1>
  <p class="sub">关于人格、关系和情绪。免费，不用注册，做完马上出结果。</p>
  <main class="grid">
    <a class="w" href="mbti/index.html"><canvas data-p="0"></canvas>
      <div class="no"><span>01</span><span>人格</span></div>

      <div class="no"><span>02</span><span>关系</span></div>
      <div><div class="t">恋爱安全感<br>说明书</div><div class="m">22 题 · 约 4 分钟</div></div></a>
    <a class="w" href="mind/index.html"><canvas data-p="2"></canvas>
      <div class="no"><span>03</span><span>情绪</span></div>
      <div><div class="t">心境自评</div><div class="m">了解最近的状态，不是诊断</div></div></a>
    <a class="w" href="https://amberveil.gicp.fun/"><canvas data-p="3"></canvas>
      <div class="no"><span>04</span><span>塔罗</span></div>

  </main>
  <footer>© 2026 Amber · 欢迎分享；商用或改编请先取得书面授权</footer>
</div>
<script>
(function(){
  var P=[[[255,122,69],[255,61,127],[120,60,255]],[[255,74,110],[255,176,120],[120,20,60]],[[60,140,255],[120,230,210],[20,30,90]],[[180,140,255],[255,210,140],[40,20,80]]];
  var all=[];
  function setup(cv,p){
    var ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),w,h;
    function size(){w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
    size();window.addEventListener('resize',size);
    var B=[];for(var i=0;i<4;i++)B.push({a:Math.random()*6.28,s:.15+Math.random()*.2,r:.5+Math.random()*.35,c:p[i%3],o:Math.random()*6.28});
    var L=[];for(var j=0;j<12;j++)L.push({y:Math.random(),k:.6+Math.random()*1.6,ph:Math.random()*6.28});
    all.push(function(t){
      ctx.globalCompositeOperation='source-over';ctx.fillStyle='#141416';ctx.fillRect(0,0,w,h);
      ctx.globalCompositeOperation='lighter';
      B.forEach(function(b){var x=w*(.5+.4*Math.cos(t*b.s+b.a)),y=h*(.5+.36*Math.sin(t*b.s*1.3+b.o)),R=Math.max(w,h)*b.r,g=ctx.createRadialGradient(x,y,0,x,y,R);
        g.addColorStop(0,'rgba('+b.c+',.65)');g.addColorStop(1,'rgba('+b.c+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)});
      ctx.globalCompositeOperation='source-over';ctx.lineWidth=1;
      L.forEach(function(l,n){ctx.strokeStyle='rgba(255,255,255,'+(.06+.05*Math.sin(t*.5+l.ph))+')';ctx.beginPath();
        for(var x=0;x<=w;x+=6){var y=h*l.y+Math.sin(x*.02*l.k+t*.4+l.ph)*10+Math.sin(x*.04+t*.2+n)*4;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()});
    });
  }
  document.querySelectorAll('.w canvas').forEach(function(cv){setup(cv,P[+cv.dataset.p])});
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
  function loop(now){var t=reduce?8:(now-t0)/1000;all.forEach(function(f){f(t)});if(!reduce)requestAnimationFrame(loop)}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
