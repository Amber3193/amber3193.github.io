<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不按剧本听歌台</title>
<meta property="og:type" content="website">
<meta property="og:title" content="不按剧本听歌台">
<meta property="og:description" content="7 首原创音乐：星尘、胶片、点燃三个面，点开就能听。">
<meta property="og:image" content="https://amber319.com/share/radio.jpg">
<meta property="og:url" content="https://amber319.com/radio/">
<meta name="twitter:card" content="summary">
<link rel="image_src" href="https://amber319.com/share/radio.jpg">
<meta name="description" content="7 首原创音乐：星尘、胶片、点燃三个面，点开就能听。">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500&family=Lora:ital@1&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  /* 布局：单列卡片；封面与唱片错位叠放，下面是标题、进度、控制，再下面是歌单 */
  color-scheme: dark;
  --ink:#070708;          /* 底色 */
  --panel:#111113;        /* 卡片 */
  --line:#2a2927;         /* 细线 */
  --paper:#f6f2ec;        /* 主文字 */
  --soft:#c8c2ba;         /* 次文字 */
  --dim:#8b857c;          /* 注释 */
  --warm:#f2c496;         /* 暖光 */
  --cool:#a4c4ec;         /* 冷光 */
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --ital:"Lora",Georgia,serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink)}
body{color:var(--paper);font-family:var(--serif);font-weight:300;line-height:1.6;
  background:radial-gradient(120% 60% at 50% 0%,#17161a 0%,var(--ink) 60%) fixed,var(--ink);min-height:100%}
.wrap{max-width:560px;margin:0 auto;padding:22px 18px 56px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cool);outline-offset:3px;border-radius:8px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:22px;font-weight:500;letter-spacing:.32em}
.brand p{font-family:var(--ital);font-style:italic;color:var(--soft);font-size:13px}
.dice{border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;letter-spacing:.2em;
  background:var(--paper);color:#111;font-weight:500;white-space:nowrap}
.dice:active{transform:translateY(1px)}

.air{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:999px;padding:7px 8px;overflow:hidden}
.air b{flex:none;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.18em;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--soft);display:flex;align-items:center;gap:7px}
.air b i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.playing .air b i{background:var(--warm);box-shadow:0 0 10px var(--warm);animation:blink 1.6s ease-in-out infinite}
.air .run{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.air .run span{display:inline-block;white-space:nowrap;font-size:13px;color:var(--soft);letter-spacing:.12em;animation:run 26s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes blink{50%{opacity:.35}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dim);
  padding-bottom:14px;border-bottom:1px dashed var(--line)}
.meta .side{color:var(--warm)}

.stage{position:relative;height:0;padding-bottom:66%;margin:18px 0 6px}
.cover{position:absolute;left:0;top:0;width:66%;aspect-ratio:1;border-radius:14px;overflow:hidden;border:1px solid var(--line);z-index:2;
  box-shadow:0 18px 40px rgba(0,0,0,.6)}
.cover canvas{width:100%;height:100%;display:block}
.cover .cap{position:absolute;left:12px;bottom:10px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--soft)}
.disc{position:absolute;right:0;top:3%;width:62%;aspect-ratio:1;border-radius:50%;z-index:1;
  background:
   radial-gradient(circle,var(--ink) 0 4%,var(--warm) 4.5% 5%,#1b1a1c 5.5% 21%,transparent 21.5%),
   repeating-radial-gradient(circle,#0c0c0d 0 1.2px,#1a191b 1.6px 2.6px);
  border:1px solid #2f2e30;animation:spin 9s linear infinite;animation-play-state:paused}
.disc::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg,transparent 0 8%,rgba(246,242,236,.10) 12%,transparent 18% 50%,rgba(164,196,236,.10) 58%,transparent 66%)}
.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}

h2{font-size:30px;font-weight:300;letter-spacing:.18em;text-wrap:balance;margin-top:8px}
.en{font-family:var(--ital);font-style:italic;color:var(--soft);font-size:15px}
.note{color:var(--dim);font-size:13px;letter-spacing:.06em;margin-top:6px}

.seek{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:18px;
  font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--paper) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--paper)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--paper);margin-top:-6px;
  box-shadow:0 0 0 5px rgba(246,242,236,.08)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--paper)}

.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctl button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.ctl button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ctl button[aria-pressed=true]{color:var(--warm)}
.ctl .play{width:68px;height:68px;background:var(--paper);color:#111}
.ctl .play svg{width:24px;height:24px;fill:currentColor;stroke:none}
.ctl button:active{transform:scale(.96)}
.ctl .lab{display:flex;flex-direction:column;align-items:center;gap:2px}
.ctl .lab small{font-size:10.5px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.ctl .lab:has(button[aria-pressed=true]) small{color:var(--warm)}
.ctl .play.loading svg{opacity:0}
.ctl .play.loading::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid rgba(17,17,17,.25);border-top-color:#111;animation:spin .9s linear infinite}
.ctl .play{position:relative}
.mute[hidden]{display:none}
.mute{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--dim)}
.mute button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--soft);font-size:13px;min-height:40px}
.mute button[aria-pressed=true]{color:var(--warm);border-color:var(--warm)}
.mute svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:var(--paper);color:#111;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
.vol{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.vol svg{width:18px;height:18px;fill:none;stroke:var(--dim);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.volnote{font-size:12px;color:var(--dim);margin-top:10px;letter-spacing:.06em}
.err{color:var(--warm);font-size:13px;margin-top:10px}

.list h3{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.18em;color:var(--dim);padding-bottom:10px;border-bottom:1px dashed var(--line)}
.list ol{list-style:none;padding:0}
.list li button{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;text-align:left;padding:13px 2px;border-bottom:1px solid #1b1a1c}
.list li:last-child button{border-bottom:0}
.list .no{font-family:var(--mono);font-size:12px;color:var(--dim)}
.list .t{font-size:17px;letter-spacing:.12em}
.list .s{font-size:12px;color:var(--dim);letter-spacing:.04em}
.list .d{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.list li.on .t{color:var(--warm)}
.list li.on .no{color:var(--warm)}
footer{color:var(--dim);font-size:12px;letter-spacing:.06em;text-align:center}
@media (prefers-reduced-motion:reduce){.disc,.air .run span,.air b i{animation:none!important}}
</style>
</head>
<body>
<img src="https://amber319.com/share/radio.jpg" alt="" aria-hidden="true" width="300" height="300" style="position:absolute;left:-9999px;top:0;width:300px;height:300px">
<div class="wrap" id="app">
  <header>
    <div class="brand">
      <h1>不按剧本</h1>
      <p>Amber · Not by the Script · 听歌台</p>
    </div>
    <button class="dice" id="dice" type="button">随机一首</button>
  </header>

  <div class="air" aria-hidden="true">
    <b><i></i>ON AIR</b>
    <div class="run"><span id="ticker"></span></div>
  </div>

  <main class="card">
    <div class="meta"><span class="side" id="side"></span><span id="count"></span></div>
    <div class="stage">
      <div class="disc"></div>
      <div class="cover"><canvas id="cv" width="600" height="600"></canvas>
        <div class="cap"><span id="capL"></span><span id="capR"></span></div></div>
    </div>
    <h2 id="title"></h2>
    <p class="en" id="en"></p>
    <p class="note" id="note"></p>

    <div class="seek">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放进度">
      <span id="dur">0:00</span>
    </div>
    <div class="ctl">
      <span class="lab"><button type="button" id="shuf" aria-pressed="false" aria-label="随机播放"><svg viewBox="0 0 24 24"><path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c1.6 0 2.9-1 4-2.4M14 9.4c1.100-1.400 2.400-2.400 4-2.400h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button><small>随机</small></span>
      <button type="button" id="prev" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5l-9 7 9 7z"/></svg></button>
      <button type="button" class="play" id="play" aria-label="播放"><svg viewBox="0 0 24 24" id="ico"><path d="M8 5v14l11-7z"/></svg></button>
      <button type="button" id="next" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l9 7-9 7z"/></svg></button>
      <span class="lab"><button type="button" id="rep" aria-pressed="false" aria-label="单曲循环"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"/></svg></button><small>单曲循环</small></span>
    </div>
    <div class="vol" id="volrow">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6"/></svg>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="音量">
      <span id="volv">80</span>
    </div>
    <div class="mute" id="muterow" hidden><button type="button" id="muteBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6"/></svg><span>静音</span></button><span>音量请用手机侧边键调</span></div>
    <p class="err" id="err" hidden></p>
  </main>

  <section class="card list">
    <h3>歌单 · 7 首原创</h3>
    <ol id="list"></ol>
  </section>
  <footer>全部曲目为原创合成，无人声演唱。</footer>
</div>
<audio id="au" preload="metadata" playsinline></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const SIDES={A:{name:"A 面 · 星尘",c:["#f2c496","#a4c4ec"]},B:{name:"B 面 · 胶片",c:["#e9a9a0","#7e9bd6"]},C:{name:"C 面 · 点燃",c:["#f2a56b","#8fa6f0"]}};
const TRACKS=[
 {f:"01",t:"星尘自取",en:"Stardust, Help Yourself",s:"A",bpm:72,d:138,n:"柔和的叮、铺底和弦、一串星光"},
 {f:"02",t:"纸上的光",en:"Light on Paper",s:"A",bpm:84,d:130,n:"钢琴、心跳一样的轻鼓点"},
 {f:"03",t:"蓝色胶片",en:"Blue Film",s:"B",bpm:66,d:135,n:"颤音吉他、弦乐、合成人声铺垫"},
 {f:"04",t:"夏末慢镜头",en:"Late Summer, Slow Motion",s:"B",bpm:60,d:148,n:"钢琴分解和弦、弦乐慢慢涨上来"},
 {f:"05",t:"慢慢点燃",en:"Slow Burn",s:"C",bpm:118,d:135,n:"先沉下去，40 小节后整首亮起来"},
 {f:"06",t:"凌晨的高速",en:"Highway at 3 A.M.",s:"C",bpm:108,d:147,n:"滚动的低音、一闪一闪的琶音"},
 {f:"07",t:"心流",en:"Flow State",s:"C",bpm:124,d:128,n:"最快的一首，适合干活时循环"}
];
const $=id=>document.getElementById(id), au=$("au"), app=$("app");
let cur=0, shuffle=false, seeking=false;
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};

$("ticker").textContent=("一听就沉下去，慢慢被点燃　★　"+TRACKS.map(x=>x.t).join("　·　")+"　★　").repeat(2);

const list=$("list");
TRACKS.forEach((x,i)=>{
  const li=document.createElement("li"), b=document.createElement("button"); b.type="button";
  b.innerHTML=`<span class="no">${x.f}</span><span><span class="t">${x.t}</span><br><span class="s">${SIDES[x.s].name} · ${x.bpm} BPM</span></span><span class="d">${fmt(x.d)}</span>`;
  b.addEventListener("click",()=>{select(i);play()}); li.appendChild(b); list.appendChild(li);
});

/* 封面：星尘颗粒 + 一暖一冷两团光，按节拍轻轻呼吸 */
const cv=$("cv"), g=cv.getContext("2d"); let dust=[], t0=performance.now();
function seedDust(seed){let s=seed*9301+49297;const r=()=>(s=(s*9301+49297)%233280)/233280;
  dust=Array.from({length:150},()=>({x:r()*600,y:r()*600,r:.6+r()*1.8,p:r()*6.28,v:4+r()*10}))}
function glow(x,y,rad,col,a){const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,col);gr.addColorStop(1,"rgba(0,0,0,0)");
  g.globalAlpha=a;g.fillStyle=gr;g.fillRect(0,0,600,600);g.globalAlpha=1}
function draw(now){
  const x=TRACKS[cur], c=SIDES[x.s].c, on=!au.paused, t=(now-t0)/1000;
  const beat=on?(Math.sin(au.currentTime*Math.PI*2*x.bpm/60)+1)/2:0.3;
  g.fillStyle="#0b0b0d";g.fillRect(0,0,600,600);
  const k=cur*1.7, dx=Math.cos(t*.12+k)*40, dy=Math.sin(t*.1+k)*40;
  glow(210+dx,250+dy,300+beat*26,c[0],.55); glow(410-dx,370-dy,300+(1-beat)*26,c[1],.5);
  g.fillStyle="#f6f2ec";
  for(const d of dust){const y=(d.y-(on?t*d.v:0)%600+600)%600; g.globalAlpha=(.25+.5*(.5+.5*Math.sin(t*1.3+d.p)))*(.4+.25*d.r);
    g.beginPath();g.arc(d.x,y,d.r,0,6.28);g.fill()}
  g.globalAlpha=1;g.strokeStyle="rgba(246,242,236,.5)";g.lineWidth=1.2;g.beginPath();g.arc(300,300,118+beat*5,0,6.28);g.stroke();
  g.strokeStyle="rgba(246,242,236,.14)";g.beginPath();g.arc(300,300,138+beat*5,0,6.28);g.stroke();
  g.fillStyle="#f6f2ec";g.font='300 132px "Noto Serif SC","Songti SC",serif';g.textAlign="center";g.textBaseline="middle";g.fillText(x.f,300,306);
  requestAnimationFrame(draw);
}

function select(i){
  cur=(i+TRACKS.length)%TRACKS.length; const x=TRACKS[cur];
  au.src="audio/"+x.f+".mp3"; au.load(); seedDust(cur+3);
  $("side").textContent=SIDES[x.s].name+" · "+x.bpm+" BPM"; $("count").textContent="TRACK "+x.f+" / 0"+TRACKS.length;
  $("title").textContent=x.t; $("en").textContent=x.en; $("note").textContent=x.n;
  $("capL").textContent="NOT BY THE SCRIPT"; $("capR").textContent=SIDES[x.s].name.slice(0,3);
  $("dur").textContent=fmt(x.d); $("cur").textContent="0:00"; setSeek(0); $("err").hidden=true;
  [...list.children].forEach((li,j)=>li.classList.toggle("on",j===cur));
  document.documentElement.style.setProperty("--warm",SIDES[x.s].c[0]); document.documentElement.style.setProperty("--cool",SIDES[x.s].c[1]);
  save("radio-track",cur);
  try{navigator.mediaSession.metadata=new MediaMetadata({title:x.t,artist:"不按剧本听歌台",album:SIDES[x.s].name})}catch(e){}
}
function setSeek(p){const s=$("seek");s.value=p*1000;s.style.setProperty("--p",(p*100)+"%")}
function play(){au.play().catch(()=>{$("err").textContent="这首没能播放，点一下播放键再试一次。";$("err").hidden=false})}
function toggle(){au.paused?play():au.pause()}
function step(n){select(shuffle?rand():cur+n);play()}
function rand(){let i;do{i=Math.floor(Math.random()*TRACKS.length)}while(i===cur);return i}

$("play").addEventListener("click",toggle);
$("next").addEventListener("click",()=>step(1));
$("prev").addEventListener("click",()=>{if(au.currentTime>4){au.currentTime=0}else step(-1)});
$("dice").addEventListener("click",()=>{select(rand());play()});
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1600)}
$("shuf").addEventListener("click",e=>{shuffle=!shuffle;e.currentTarget.setAttribute("aria-pressed",shuffle);toast(shuffle?"已开启随机播放":"已关闭随机，按顺序播放")});
$("rep").addEventListener("click",e=>{au.loop=!au.loop;e.currentTarget.setAttribute("aria-pressed",au.loop);toast(au.loop?"已开启单曲循环":"已关闭单曲循环")});
au.addEventListener("play",()=>{app.classList.add("playing");$("ico").innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';$("play").setAttribute("aria-label","暂停")});
au.addEventListener("pause",()=>{app.classList.remove("playing");$("ico").innerHTML='<path d="M8 5v14l11-7z"/>';$("play").setAttribute("aria-label","播放")});
au.addEventListener("ended",()=>step(1));
let lt;const busy=on=>{clearTimeout(lt);if(on)lt=setTimeout(()=>{$("play").classList.add("loading");$("play").setAttribute("aria-label","加载中")},100);else $("play").classList.remove("loading")};
au.addEventListener("waiting",()=>busy(true));["playing","pause","canplay","error"].forEach(ev=>au.addEventListener(ev,()=>busy(false)));
au.addEventListener("error",()=>{$("err").textContent="音频没加载出来，检查一下网络后再点播放。";$("err").hidden=false});
au.addEventListener("loadedmetadata",()=>{if(isFinite(au.duration))$("dur").textContent=fmt(au.duration)});
au.addEventListener("timeupdate",()=>{if(seeking)return;const d=isFinite(au.duration)?au.duration:TRACKS[cur].d;$("cur").textContent=fmt(au.currentTime);setSeek(au.currentTime/d)});
const sk=$("seek");
sk.addEventListener("input",()=>{seeking=true;sk.style.setProperty("--p",(sk.value/10)+"%");const d=isFinite(au.duration)?au.duration:TRACKS[cur].d;$("cur").textContent=fmt(sk.value/1000*d)});
sk.addEventListener("change",()=>{const d=isFinite(au.duration)?au.duration:TRACKS[cur].d;au.currentTime=sk.value/1000*d;seeking=false});
const vol=$("vol");
function setVol(v){au.volume=v/100;vol.style.setProperty("--p",v+"%");$("volv").textContent=v;save("radio-vol",v)}
vol.addEventListener("input",()=>setVol(+vol.value));
/* iPhone / iPad 不允许网页改音量（苹果限制），改用静音开关 + 侧键提示 */
const IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
if(IOS){$("volrow").hidden=true;$("volrow").style.display="none";$("muterow").hidden=false;
  $("muteBtn").addEventListener("click",e=>{au.muted=!au.muted;e.currentTarget.setAttribute("aria-pressed",au.muted);e.currentTarget.querySelector("span").textContent=au.muted?"已静音":"静音";toast(au.muted?"已静音":"已取消静音")})}
else{const v=+(load("radio-vol")||80);vol.value=v;setVol(v)}
try{["play","pause"].forEach(a=>navigator.mediaSession.setActionHandler(a,toggle));
  navigator.mediaSession.setActionHandler("nexttrack",()=>step(1));navigator.mediaSession.setActionHandler("previoustrack",()=>step(-1))}catch(e){}
select(+(load("radio-track")||0)); requestAnimationFrame(draw);
</script>
</body>
</html>
